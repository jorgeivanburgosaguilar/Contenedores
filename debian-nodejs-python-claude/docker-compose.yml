name: debian-nodejs

services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code
    hostname: claude-code
    ports:
      - '3000:3000'
    tty: true
    stdin_open: true
    working_dir: /workspace
    volumes:
      - ./workspaces/claude-code:/workspace
      - claude-code-home:/root

volumes:
  claude-code-home:
